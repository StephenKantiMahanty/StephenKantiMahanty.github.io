name = "stephen-kanti-mahanty-portfolio"
main = "worker.js"
compatibility_date = "2026-03-22"
routes = [
  { pattern = "kantimahanty.com/upload", zone_name = "kantimahanty.com" },
  { pattern = "kantimahanty.com/upload/*", zone_name = "kantimahanty.com" },
  { pattern = "kantimahanty.com/uploads/*", zone_name = "kantimahanty.com" },
  { pattern = "kantimahanty.com/api/uploads*", zone_name = "kantimahanty.com" },
]

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = ["/api/*", "/upload", "/upload/", "/upload/index.html", "/uploads/*"]

[[r2_buckets]]
binding = "UPLOADS_BUCKET"
bucket_name = "private-image-uploads"
