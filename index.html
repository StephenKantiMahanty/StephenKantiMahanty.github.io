<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stephen Kanti Mahanty</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body class="home-page">
    <div class="circuit-container">
        <div class="grid-background"></div>
        <canvas class="spark-canvas" aria-hidden="true"></canvas>
        
        <div class="circuit-board">
            <!-- Circuit traces (connecting lines) -->
            <svg class="circuit-traces" viewBox="0 0 1400 900" preserveAspectRatio="none">
                <!-- Main power line from left -->
                <path d="M 150 450 L 400 450" class="trace trace-1" data-route="shared" />
                
                <!-- Branch up to Capacitor (About) -->
                <path d="M 400 450 L 400 250" class="trace trace-2" data-route="about" />
                <path d="M 400 250 L 600 250" class="trace trace-3" data-route="about" />
                
                <!-- Horizontal line to Resistor (Projects) -->
                <path d="M 400 450 L 600 450" class="trace trace-4" data-route="projects" />
                
                <!-- Branch down to Inductor (Experience) -->
                <path d="M 400 450 L 400 650" class="trace trace-5" data-route="experience" />
                <path d="M 400 650 L 600 650" class="trace trace-6" data-route="experience" />
                
                <!-- Return paths to close the loop -->
                <path d="M 800 250 L 1000 250" class="trace trace-7" data-route="about" />
                <path d="M 800 450 L 1000 450" class="trace trace-8" data-route="projects" />
                <path d="M 800 650 L 1000 650" class="trace trace-9" data-route="experience" />
                
                <!-- Vertical collector on right side -->
                <path d="M 1000 250 L 1000 650" class="trace trace-10" data-route="shared" />
                
                <!-- Output path -->
                <path d="M 1000 450 L 1250 450" class="trace trace-11" data-route="shared" />
                
                <!-- Junction points -->
                <circle cx="400" cy="450" r="5" class="junction-point junction-1" />
                <circle cx="400" cy="250" r="4" class="junction-point junction-2" />
                <circle cx="400" cy="650" r="4" class="junction-point junction-3" />
                <circle cx="1000" cy="450" r="5" class="junction-point junction-4" />
                <circle cx="1000" cy="250" r="4" class="junction-point junction-5" />
                <circle cx="1000" cy="650" r="4" class="junction-point junction-6" />
                
            </svg>

            <span class="circuit-endpoint endpoint-input" aria-hidden="true"></span>
            <span class="circuit-endpoint endpoint-output" aria-hidden="true"></span>
        
            <!-- Circuit Components as Navigation -->
            <div class="component-container">
                <!-- Resistor - Projects -->
                <a href="projects/index.html" class="component resistor" data-component="projects" aria-label="View projects">
                    <svg viewBox="0 0 200 80" class="component-svg">
                        <!-- Resistor body -->
                        <rect x="20" y="25" width="160" height="30" fill="none" stroke="currentColor" stroke-width="2"/>
                        
                        <!-- Resistor bands (color coding) -->
                        <rect x="50" y="25" width="8" height="30" fill="var(--accent-green)" opacity="0.8"/>
                        <rect x="75" y="25" width="8" height="30" fill="var(--accent-green)" opacity="0.6"/>
                        <rect x="100" y="25" width="8" height="30" fill="var(--accent-green)" opacity="0.4"/>
                        <rect x="125" y="25" width="8" height="30" fill="var(--accent-green)" opacity="0.9"/>
                        
                        <!-- Connection wires -->
                        <line x1="0" y1="40" x2="20" y2="40" stroke="currentColor" stroke-width="2"/>
                        <line x1="180" y1="40" x2="200" y2="40" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span class="component-label">PROJECTS</span>
                </a>
                
                <!-- Capacitor - About Me -->
                <a href="about/index.html" class="component capacitor" data-component="about" aria-label="Read about Stephen">
                    <svg viewBox="0 0 200 80" class="component-svg">
                        <!-- Capacitor plates -->
                        <line x1="94" y1="18" x2="94" y2="62" stroke="currentColor" stroke-width="3"/>
                        <line x1="106" y1="18" x2="106" y2="62" stroke="currentColor" stroke-width="3"/>
                        
                        <!-- Connection wires -->
                        <line x1="0" y1="40" x2="94" y2="40" stroke="currentColor" stroke-width="3"/>
                        <line x1="106" y1="40" x2="200" y2="40" stroke="currentColor" stroke-width="3"/>
                        
                        <!-- Plus/minus indicators -->
                        <text x="72" y="32" font-size="17" fill="currentColor">+</text>
                        <text x="116" y="32" font-size="17" fill="currentColor">−</text>
                    </svg>
                    <span class="component-label">ABOUT ME</span>
                </a>
                
                <!-- Inductor - Experience -->
                <a href="experience/index.html" class="component inductor" data-component="experience" aria-label="View experience">
                    <svg viewBox="0 0 200 80" class="component-svg">
                        <!-- Inductor coils -->
                        <path d="M 25 40 Q 40 20 55 40 Q 70 60 85 40 Q 100 20 115 40 Q 130 60 145 40 Q 160 20 175 40"
                            fill="none" 
                            stroke="currentColor" 
                            stroke-width="2.5"
                            stroke-linecap="round"/>
                        
                        <!-- Connection wires -->
                        <line x1="0" y1="40" x2="25" y2="40" stroke="currentColor" stroke-width="2"/>
                        <line x1="175" y1="40" x2="200" y2="40" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span class="component-label">EXPERIENCE</span>
                </a>
            </div>
        </div>

        <!-- Title/Header (name only, voltage moved out) -->
        <div class="header">
            <h1 class="portfolio-title">STEPHEN KANTI MAHANTY</h1>
        </div>
        
        <div class="signal-console" aria-label="Interactive circuit controls">
            <label class="voltage-indicator">
                <span class="voltage-value">5.0V</span>
                <span class="voltage-bar">
                    <span class="voltage-fill"></span>
                    <input class="voltage-control" type="range" min="3.3" max="9" value="5" step="0.1" aria-label="Circuit voltage">
                </span>
            </label>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
